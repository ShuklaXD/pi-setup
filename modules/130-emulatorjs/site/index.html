<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0d0d10" />
  <title>NES Arcade</title>
  <style>
    :root{
      --bg:#0d0d10; --panel:#16161c; --panel-2:#1d1d25; --line:#2a2a35;
      --ink:#f2f2f5; --muted:#9a9aad; --red:#e60012; --red-dim:#8e0d18;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    a{color:inherit;text-decoration:none}

    header{position:sticky;top:0;z-index:10;background:rgba(13,13,16,.92);
      backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .hwrap{max-width:1200px;margin:0 auto;padding:16px 20px;
      display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;
      font-size:15px;text-transform:uppercase}
    .logo .dot{width:11px;height:11px;border-radius:50%;background:var(--red);
      box-shadow:0 0 12px var(--red)}
    .count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
    .search{margin-left:auto;position:relative}
    .search input{width:260px;max-width:52vw;padding:9px 12px 9px 34px;border-radius:9px;
      border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px;outline:none}
    .search input:focus{border-color:var(--red-dim);box-shadow:0 0 0 3px rgba(230,0,18,.12)}
    .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
      width:15px;height:15px;fill:var(--muted)}

    main{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
    .grid{display:grid;gap:16px;
      grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
      overflow:hidden;display:flex;flex-direction:column;
      transition:transform .13s ease,border-color .13s ease,box-shadow .13s ease}
    .card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--red-dim);
      box-shadow:0 8px 24px rgba(0,0,0,.5);outline:none}
    .art{aspect-ratio:1/1;background:var(--panel-2);display:grid;place-items:center;
      border-bottom:1px solid var(--line);overflow:hidden}
    .art img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
    .art .ph{font-size:26px;font-weight:800;color:var(--red-dim);letter-spacing:.08em}
    .meta{padding:10px 11px 12px}
    .name{font-size:13.5px;font-weight:600;line-height:1.32;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .sys{margin-top:5px;font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

    .empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
    .empty code{background:var(--panel);border:1px solid var(--line);border-radius:5px;
      padding:2px 6px;color:var(--ink);font-size:13px}
    footer{max-width:1200px;margin:0 auto;padding:0 20px 40px;color:var(--muted);
      font-size:12px;line-height:1.7;border-top:1px solid var(--line);padding-top:18px}
  </style>
</head>
<body>
  <header>
    <div class="hwrap">
      <div class="logo"><span class="dot"></span>NES Arcade</div>
      <div class="count" id="count"></div>
      <div class="search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
        <input id="q" type="search" placeholder="Search games…" autocomplete="off" spellcheck="false" />
      </div>
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </main>

  <footer>
    Runs entirely in your browser (WASM) — engine, cores and ROMs are served from this Pi, nothing loads from a CDN.<br />
    Add your own cartridge dumps to <code>~/emulatorjs/library/roms/nes/</code>, then re-run <code>gen-library.sh</code>.
  </footer>

  <script>
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const countEl = document.getElementById('count');
    const q = document.getElementById('q');
    let games = [];

    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function card(g) {
      const href = 'play.html?rom=' + encodeURIComponent(g.rom) +
                   '&core=' + encodeURIComponent(g.core || 'nes') +
                   '&title=' + encodeURIComponent(g.title);
      const art = g.art
        ? `<img src="library/${esc(g.art)}" alt="" loading="lazy" />`
        : `<span class="ph">${esc((g.title[0] || '?').toUpperCase())}</span>`;
      return `<a class="card" href="${href}">
        <div class="art">${art}</div>
        <div class="meta"><div class="name">${esc(g.title)}</div>
        <div class="sys">${esc(g.system || 'NES')}</div></div></a>`;
    }

    function render(list) {
      grid.innerHTML = list.map(card).join('');
      countEl.textContent = list.length + (list.length === 1 ? ' game' : ' games');
      const none = list.length === 0;
      empty.hidden = !none;
      if (none) {
        empty.innerHTML = games.length
          ? 'No games match that search.'
          : 'No ROMs found.<br />Drop <code>.nes</code> files into <code>~/emulatorjs/library/roms/nes/</code> and re-run <code>gen-library.sh</code>.';
      }
    }

    function filter() {
      const t = q.value.trim().toLowerCase();
      render(t ? games.filter(g => g.title.toLowerCase().includes(t)) : games);
    }

    q.addEventListener('input', filter);
    // Enter launches the top result; "/" jumps to the search box.
    q.addEventListener('keydown', e => {
      if (e.key === 'Enter') { const f = grid.querySelector('.card'); if (f) f.click(); }
    });
    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    });

    fetch('library/games.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(d => { games = d.games || []; render(games); })
      .catch(() => {
        countEl.textContent = '';
        empty.hidden = false;
        empty.innerHTML = 'Could not load <code>library/games.json</code> — run <code>gen-library.sh</code>.';
      });
  </script>
</body>
</html>
